<div class="gestio-field">
  @if (label()) {
    <label class="gestio-field__label" [for]="controlId()">
      {{ label() }}
      @if (required()) {
        <span class="gestio-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div
    class="gestio-field__control"
    [class.is-sm]="size() === 'sm'"
    [class.is-lg]="size() === 'lg'"
    [class.is-invalid]="isInvalid()"
    [class.is-disabled]="isDisabled()"
    [class.is-readonly]="readonly()"
  >
    <input
      #control
      class="gestio-field__native"
      type="text"
      autocomplete="off"
      [id]="controlId()"
      [value]="inputText()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [attr.name]="name() ?? null"
      [attr.placeholder]="placeholderText()"
      [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput(control.value)"
      (blur)="handleBlur()"
      (keydown.enter)="handleEnter()"
      (keydown.alt.arrowdown)="openFromKeyboard($event)"
    />

    <button
      type="button"
      class="gestio-date-picker__toggle"
      [gestioPopoverTrigger]="calendar"
      popoverAlign="end"
      popoverModal
      [popoverArrow]="false"
      [popoverAriaLabel]="dialogLabel()"
      popoverAutoFocus=".gestio-calendar__day[tabindex='0']"
      [popoverDisabled]="isDisabled() || readonly()"
      [disabled]="isDisabled()"
      [attr.aria-label]="toggleLabel()"
      (closed)="handleClosed()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
        <path d="M3.5 10h17M8 3v4M16 3v4" />
      </svg>
    </button>
  </div>

  @if (hint()) {
    <p class="gestio-field__hint" [id]="hintId">{{ hint() }}</p>
  }
  @if (errorMessage()) {
    <p class="gestio-field__error" [id]="errorId">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 4.5v4.2M8 11v.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>{{ errorMessage() }}</span>
    </p>
  }
</div>

<ng-template #calendar>
  <gestio-calendar
    class="gestio-date-picker__calendar"
    [mode]="mode()"
    [value]="value()"
    (valueChange)="pickDate($event)"
    [range]="draftRange()"
    (rangeChange)="pickRange($event)"
    [min]="min()"
    [max]="max()"
    [dateDisabled]="dateDisabled()"
    [locale]="locale()"
    [firstDayOfWeek]="firstDayOfWeek()"
    [today]="todayDate()"
    [labels]="calendarLabels()"
  />
</ng-template>
