<div class="gestio-drawer__header" [class.has-close]="showClose()">
  <div class="gestio-drawer__heading">
    <h2 class="gestio-drawer__title" [id]="titleId">{{ heading() }}</h2>
    <!-- Toujours présent pour que la référence aria-describedby reste valide. -->
    <p class="gestio-drawer__description" [id]="descriptionId" [hidden]="!description()">
      {{ description() }}
    </p>
  </div>
  <div class="gestio-drawer__header-extra"><ng-content select="[gestioDrawerHeader]" /></div>
</div>
<div class="gestio-drawer__body">
  <ng-content />
</div>
<div class="gestio-drawer__footer"><ng-content select="[gestioDrawerFooter]" /></div>
<!-- En fin de DOM : le focus initial va au contenu ; affiché en haut à droite. -->
@if (showClose()) {
  <button
    type="button"
    class="gestio-drawer__close"
    [attr.aria-label]="text().close"
    (click)="close()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M4 4l8 8M12 4l-8 8" />
    </svg>
  </button>
}
