<div class="gestio-field" (focusout)="handleFocusOut($event)">
  @if (label()) {
    <label class="gestio-field__label" [id]="labelId" [for]="controlId()">
      {{ label() }}
      @if (isRequired()) {
        <span class="gestio-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div
    class="gestio-field__control gestio-chip-input__control"
    [class.is-sm]="size() === 'sm'"
    [class.is-lg]="size() === 'lg'"
    [class.is-invalid]="showInvalid()"
    [class.is-disabled]="isDisabled()"
    (click)="handleControlClick($event)"
  >
    @if (chips().length) {
      <ul class="gestio-chip-input__list" [attr.aria-label]="text().list">
        @for (chip of chips(); track $index) {
          <li class="gestio-chip-input__item">
            <gestio-chip
              removable
              [variant]="variant()"
              [disabled]="isDisabled()"
              [labels]="chipLabels()"
              (removed)="removeAt($index)"
              >{{ chip }}</gestio-chip
            >
          </li>
        }
      </ul>
    }

    <input
      #control
      class="gestio-field__native gestio-chip-input__native"
      type="text"
      autocomplete="off"
      enterkeyhint="enter"
      [id]="controlId()"
      [value]="draft()"
      [disabled]="isDisabled()"
      [attr.placeholder]="placeholder() ?? null"
      [attr.aria-label]="label() || formField?.hasLabel() ? null : (ariaLabel() ?? null)"
      [attr.aria-invalid]="showInvalid() ? 'true' : null"
      [attr.aria-required]="isRequired() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput(control)"
      (keydown)="handleKeydown($event)"
    />
  </div>

  <span class="gestio-sr-only" [id]="instructionsId">{{ text().instructions }}</span>

  @if (hint()) {
    <p class="gestio-field__hint" [id]="hintId">{{ hint() }}</p>
  }
  @if (error()) {
    <p class="gestio-field__error" [id]="errorId">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 4.5v4.2M8 11v.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>{{ error() }}</span>
    </p>
  }

  <span class="gestio-sr-only" aria-live="polite" aria-atomic="true">{{ announcement() }}</span>
</div>
