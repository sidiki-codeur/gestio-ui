<div class="gestio-field">
  @if (label()) {
    <label class="gestio-field__label" [for]="controlId()">
      {{ label() }}
      @if (required()) {
        <span class="gestio-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div
    class="gestio-field__control"
    [class.is-sm]="size() === 'sm'"
    [class.is-lg]="size() === 'lg'"
    [class.is-invalid]="invalid()"
    [class.is-disabled]="isDisabled()"
    [class.is-readonly]="readonly()"
  >
    <span class="gestio-field__affix"><ng-content select="[gestioPrefix]" /></span>

    <input
      #control
      class="gestio-field__native"
      [id]="controlId()"
      [type]="nativeType()"
      [value]="displayValue()"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [attr.name]="name() ?? null"
      [attr.placeholder]="placeholder() ?? null"
      [attr.autocomplete]="autocomplete() ?? null"
      [attr.min]="min() ?? null"
      [attr.max]="max() ?? null"
      [attr.step]="step() ?? null"
      [attr.maxlength]="maxlength() ?? null"
      [attr.inputmode]="type() === 'number' ? 'decimal' : null"
      [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput(control)"
      (blur)="handleBlur()"
    />

    <span class="gestio-field__affix"><ng-content select="[gestioSuffix]" /></span>

    @if (type() === 'password') {
      <button
        type="button"
        class="gestio-field__toggle"
        [attr.aria-label]="passwordVisible() ? hidePasswordLabel() : showPasswordLabel()"
        [attr.aria-controls]="controlId()"
        [disabled]="isDisabled()"
        (click)="togglePassword()"
      >
        @if (passwordVisible()) {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a12.6 12.6 0 0 1-3.2 4.3M6.6 6.6C4.4 8 2.8 10.1 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </div>

  @if (hint()) {
    <p class="gestio-field__hint" [id]="hintId">{{ hint() }}</p>
  }
  @if (error()) {
    <p class="gestio-field__error" [id]="errorId">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 4.5v4.2M8 11v.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <span>{{ error() }}</span>
    </p>
  }
</div>
