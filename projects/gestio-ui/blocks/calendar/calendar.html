<div class="gestio-calendar__header">
  <button
    type="button"
    class="gestio-calendar__nav"
    [attr.aria-label]="text().previousMonth"
    [disabled]="isDisabled() || !canGoPrevious()"
    (click)="previousMonth()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M10 3.5 5.5 8l4.5 4.5" />
    </svg>
  </button>
  <div class="gestio-calendar__title" [id]="titleId" aria-live="polite">{{ title() }}</div>
  <button
    type="button"
    class="gestio-calendar__nav"
    [attr.aria-label]="text().nextMonth"
    [disabled]="isDisabled() || !canGoNext()"
    (click)="nextMonth()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M6 3.5 10.5 8 6 12.5" />
    </svg>
  </button>
</div>

<table class="gestio-calendar__grid" role="grid" [attr.aria-label]="gridLabel()">
  <thead>
    <tr>
      @for (weekday of weekdays(); track $index) {
        <th scope="col" class="gestio-calendar__weekday" [attr.abbr]="weekday.long">
          <span aria-hidden="true">{{ weekday.short }}</span>
          <span class="gestio-calendar__sr-only">{{ weekday.long }}</span>
        </th>
      }
    </tr>
  </thead>
  <tbody>
    @for (week of weeks(); track week[0].key) {
      <tr>
        @for (day of week; track day.key) {
          @if (day.inMonth) {
            <td
              class="gestio-calendar__cell"
              [class.is-in-range]="day.inRange"
              [class.is-range-start]="day.rangeStart"
              [class.is-range-end]="day.rangeEnd"
              [attr.aria-selected]="day.selected ? 'true' : 'false'"
            >
              <button
                type="button"
                class="gestio-calendar__day"
                [class.is-today]="day.today"
                [class.is-selected]="day.selected && !day.inRange"
                [class.is-unavailable]="day.disabled"
                [attr.data-date]="day.key"
                [attr.aria-label]="day.label"
                [attr.aria-current]="day.today ? 'date' : null"
                [attr.aria-disabled]="day.disabled || isDisabled() ? 'true' : null"
                [attr.tabindex]="day.key === tabbableKey() ? 0 : -1"
                [disabled]="isDisabled()"
                (click)="select(day)"
                (keydown)="handleKeydown($event, day)"
              >
                {{ day.date.getDate() }}
              </button>
            </td>
          } @else {
            <td class="gestio-calendar__cell is-outside"></td>
          }
        }
      </tr>
    }
  </tbody>
</table>
